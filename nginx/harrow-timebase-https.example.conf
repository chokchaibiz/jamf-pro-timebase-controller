# Optional HTTPS replacement for harrow-timebase.conf.
# Replace the server_name and certificate paths with the organization's values.
server {
    listen 443 ssl;
    server_name timebase.harrow.example;

    ssl_certificate     /etc/nginx/tls/timebase-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/timebase-private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
